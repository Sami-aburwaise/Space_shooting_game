<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Controller</title>
  </head>
  <body style="height: 90vh;display: flex; justify-content: center; align-items: center;" class="black">
    <div>
      
      <button class="fire-button" onclick="fire()">
        <h1 style="margin: 0;">Fire</h1>
      </button>
      <div id="delayDisplay" style="margin-top: 40px; color: white; font-size: 1.5em; text-align: center;"></div>
  </body>
  <script>
    // --- WebRTC Setup ---
    const signalingSocket = new WebSocket('wss://socketserver-game-test.onrender.com')
    // const signalingSocket = new WebSocket('ws://192.168.101.19:8088')
    let peerConnection = null
    let dataChannel = null
    let isInitiator = false

    signalingSocket.onopen = () => {
      // Decide initiator by random (or use a button/UI)
      isInitiator = confirm('Are you the controller? OK for Yes, Cancel for No.')
      if (isInitiator) {
        setupPeer(true)
      }
    }

    signalingSocket.onmessage = async (event) => {
      let data = event.data;
      if (data instanceof Blob) {
        data = await data.text();
      }
      let msg;
      try {
        msg = JSON.parse(data);
      } catch (e) {
        console.warn('Non-JSON signaling message:', data);
        return;
      }
      if (msg.sdp) {
        if (!peerConnection) {
          setupPeer(false)
        }
        // Only set remote description if not already set to this SDP
        const sdpType = msg.sdp.type
        const currentRemote = peerConnection.remoteDescription && peerConnection.remoteDescription.sdp
        if (!currentRemote || peerConnection.remoteDescription.type !== sdpType || peerConnection.remoteDescription.sdp !== msg.sdp.sdp) {
          await peerConnection.setRemoteDescription(new RTCSessionDescription(msg.sdp))
        }
        if (msg.sdp.type === 'offer') {
          const answer = await peerConnection.createAnswer()
          await peerConnection.setLocalDescription(answer)
          signalingSocket.send(JSON.stringify({ sdp: peerConnection.localDescription }))
        }
      } else if (msg.candidate) {
        if (peerConnection) {
          await peerConnection.addIceCandidate(new RTCIceCandidate(msg.candidate))
        }
      }
    }

    function setupPeer(initiator) {
      peerConnection = new RTCPeerConnection()
      if (initiator) {
        dataChannel = peerConnection.createDataChannel('actions')
        setupDataChannel()
        peerConnection.onicecandidate = (e) => {
          if (e.candidate) {
            signalingSocket.send(JSON.stringify({ candidate: e.candidate }))
          }
        }
        peerConnection.createOffer().then(offer => {
          peerConnection.setLocalDescription(offer)
          signalingSocket.send(JSON.stringify({ sdp: offer }))
        })
      } else {
        peerConnection.ondatachannel = (e) => {
          dataChannel = e.channel
          setupDataChannel()
        }
        peerConnection.onicecandidate = (e) => {
          if (e.candidate) {
            signalingSocket.send(JSON.stringify({ candidate: e.candidate }))
          }
        }
      }
    }

    function setupDataChannel() {
      dataChannel.onopen = () => {
        console.log('WebRTC data channel open')
      }
      // Input echo delay measurement
      dataChannel.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data)
          if (msg.action === 'echo' && typeof msg.timestamp === 'number') {
            const now = Date.now()
            const diff = now - msg.timestamp
            const delayDiv = document.getElementById('delayDisplay')
            if (delayDiv) {
              delayDiv.textContent = `Input Delay: ${diff} ms`
            }
            console.log('[Controller] Sent timestamp:', msg.timestamp, '| Received timestamp:', now, '| Input Delay:', diff + 'ms', msg)
            return
          }
        } catch (e) {}
        // Optionally handle messages from game
        console.log('Received from game:', event.data)
      }
    }

    // --- Controller Actions ---
    // (Already declared above, no duplicates)

    // --- Controller Actions ---
    const fire = () => {
      if (dataChannel && dataChannel.readyState === 'open') {
        const timestamp = Date.now()
        dataChannel.send(JSON.stringify({ action: 'fire', timestamp }))
        document.body.classList.add('flash')
        document.body.classList.remove('black')
        setTimeout(() => {
          document.body.classList.remove('flash')
          document.body.classList.add('black')
        }, 100)
      }
    }

    let startX = 0
    let startY = 0
    window.addEventListener('touchstart', (event) => {
      const touch = event.touches[0]
      startX = touch.clientX
      startY = touch.clientY
    })

    let direction = { x: 0, y: 0 }
    const threshold = 10
    const directionsEqual = (dir1, dir2) => dir1.x === dir2.x && dir1.y === dir2.y

    window.addEventListener('touchmove', (event) => {
      const touch = event.touches[0]
      let inputDirection = { x: 0, y: 0 }
      if (touch.clientX - startX > threshold) {
        inputDirection.x = 1
      } else if (touch.clientX - startX < -threshold) {
        inputDirection.x = -1
      } else {
        inputDirection.x = 0
      }
      if (touch.clientY - startY > threshold) {
        inputDirection.y = -1
      } else if (touch.clientY - startY < -threshold) {
        inputDirection.y = 1
      } else {
        inputDirection.y = 0
      }
      if (!directionsEqual(inputDirection, direction)) {
        direction = inputDirection
        if (dataChannel && dataChannel.readyState === 'open') {
          const timestamp = Date.now()
          dataChannel.send(JSON.stringify({ action: 'move', direction: inputDirection, timestamp }))
        }
      }
    })

    window.addEventListener('touchend', () => {
      direction = { x: 0, y: 0 }
      if (dataChannel && dataChannel.readyState === 'open') {
        const timestamp = Date.now()
        dataChannel.send(JSON.stringify({ action: 'move', direction: direction, timestamp }))
      }
    })
  </script>

  <style>
    .black {
      background-color: black;
    }
    .flash {
      background-color: rgb(109, 0, 0);
      animation: flash 0.5s ease-in-out;
    }
    /*/
    do not alllow zoom or scroll
    /*/
    body {
      margin: 0;
      overflow: hidden;
      touch-action: none; /* Prevents default touch actions like scrolling */
    }
    .fire-button {
      padding: 30px 80px;
      position: absolute;
      right: 25px;
      top: 50%;
      transform: translateY(-50%);
      color: white;
      outline: solid white;
      background-color: black;
      border-radius: 10px;
      cursor: pointer;
      -webkit-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
  </style>
</html>
